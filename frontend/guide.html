  <script>
    (function () {
      var theme = 'dark';
      try {
        var stored = localStorage.getItem('jd_theme');
        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          theme = 'light';
        }
      } catch (err) {}
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
    })();
  </script>

          items: [
            {
              q: '업로드한 파일은 어디에 저장되나요?',
              a: '관리자가 설정한 저장소(예: Redis + 디스크)에 보관되며, 본인과 워크스페이스 관리자만 접근할 수 있습니다.'
            },
            {
              q: '결과물은 얼마나 오래 남아 있나요?',
              a: '직접 삭제하거나 관리자가 정리를 실행하기 전까지 유지됩니다. 중요한 PDF는 내려받고 불필요한 파일은 수시로 정리하세요.'
            },
            {
              q: '실행이 차단되거나 실패하면?',
              a: 'Gemini 안전 필터가 차단되면 즉시 안내합니다. 콘텐츠를 조정하거나 최소 연관도를 낮춘 뒤 다시 시도하세요. 완료된 청크에만 토큰이 사용됩니다.'
            },
            {
              q: '진행 중인 작업을 취소할 수 있나요?',
              a: '가능합니다. 상태 카드 또는 My Jobs 상세 화면에서 Cancel을 누르면 남은 청크는 중단되고 추가 토큰도 사용되지 않습니다.'
            }
          ]
        },
        footerNote: '필요한 분석 흐름이 더 있다면 피드백 버튼으로 알려주세요. JokboDude를 팀 환경에 맞게 확장해 드립니다.'
      }
    };

    function listMarkup(items) {
      return items.map(item => `<li>${item}</li>`).join('');
    }

    function stepMarkup(steps) {
      return steps.map((step, index) => `
        <li class="guide-step">
          <span class="guide-step-number">${index + 1}</span>
          <div>
            <h3>${step.title}</h3>
            <p>${step.description}</p>
          </div>
        </li>
      `).join('');
    }

    function cardMarkup(cards) {
      return cards.map(card => `
        <div class="guide-mode-card">
          <span class="mode-badge">${card.badge}</span>
          <h3 class="mode-title">${card.title}</h3>
          <p class="mode-desc">${card.description}</p>
          <ul class="mode-list">${listMarkup(card.bullets)}</ul>
          <div class="mode-output">${card.output}</div>
        </div>
      `).join('');
    }

    function tipsMarkup(groups) {
      return groups.map(group => `
        <div class="guide-best-card">
          <h3>${group.title}</h3>
          <ul>${listMarkup(group.items)}</ul>
        </div>
      `).join('');
    }

    function faqMarkup(items) {
      return items.map(entry => `
        <div class="guide-faq-item">
          <h3>${entry.q}</h3>
          <p>${entry.a}</p>
        </div>
      `).join('');
    }

    function renderTabs(links, label, note) {
      const tabs = document.getElementById('guideTabs');
      if (!tabs) return;
      const ariaLabel = label || 'Guide sections';
      tabs.setAttribute('aria-label', ariaLabel);
      tabs.innerHTML = links.map((link, index) => {
        const isActive = link.id === activePanel;
        const indexLabel = String(index + 1).padStart(2, '0');
        return `
          <button type="button" class="guide-tab${isActive ? ' active' : ''}" id="tab-${link.id}" data-panel="${link.id}" role="tab" aria-selected="${isActive}" aria-controls="panel-${link.id}">
            <span class="guide-tab-index">${indexLabel}</span>
            <span>${link.label}</span>
          </button>
        `;
      }).join('');
      const tabNote = document.getElementById('tabNote');
      if (tabNote) {
        tabNote.textContent = note || '';
        tabNote.style.display = note ? 'block' : 'none';
      }
      tabs.querySelectorAll('.guide-tab').forEach(button => {
        button.addEventListener('click', () => {
          const target = button.dataset.panel;
          if (target) {
            setActivePanel(target, { scroll: false });
          }
        });
      });
      syncPanelState();
    }

    function syncPanelState() {
      const tabButtons = document.querySelectorAll('.guide-tab');
      tabButtons.forEach(button => {
        const isActive = button.dataset.panel === activePanel;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });
      const panels = document.querySelectorAll('.guide-panel');
      panels.forEach(panel => {
        const isActive = panel.dataset.panel === activePanel;
        panel.classList.toggle('active', isActive);
        panel.setAttribute('aria-hidden', isActive ? 'false' : 'true');
      });
    }

    function setActivePanel(panelId, options = {}) {
      if (!PANEL_SET.has(panelId)) {
        return;
      }
      activePanel = panelId;
      syncPanelState();
      try { localStorage.setItem(GUIDE_PANEL_KEY, panelId); } catch (err) {}
      if (options.scroll) {
        const panelEl = document.getElementById(`panel-${panelId}`);
        if (panelEl) {
          panelEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    }

    function renderGuide(lang) {
      const t = I18N[lang] || I18N.en;
      const nextLang = lang === 'en' ? 'ko' : 'en';
      document.documentElement.lang = lang === 'ko' ? 'ko' : 'en';

      const heroKicker = document.getElementById('heroKicker');
      if (heroKicker) heroKicker.textContent = t.heroKicker || '';
      document.getElementById('heroTitle').textContent = t.heroTitle;
      document.getElementById('heroSubtitle').textContent = t.heroSubtitle;
      document.getElementById('heroList').innerHTML = listMarkup(t.heroHighlights);
      document.getElementById('heroNote').textContent = t.heroNote;
      const heroCta = document.getElementById('heroCta');
      heroCta.textContent = t.heroCta;
      heroCta.setAttribute('aria-label', t.heroCta);

      const langBtn = document.getElementById('langBtn');
      langBtn.textContent = t.toggleLabel;
      langBtn.dataset.nextLang = nextLang;

      renderTabs(t.tocLinks || PANEL_IDS.map(id => ({ id, label: id })), t.tabLabel || t.tocTitle, t.tabHint || t.tocNote);

      document.getElementById('modesTitle').textContent = t.modes.title;
      document.getElementById('modesIntro').textContent = t.modes.intro;
      document.getElementById('modesGrid').innerHTML = cardMarkup(t.modes.cards);

      document.getElementById('workflowTitle').textContent = t.workflow.title;
      document.getElementById('workflowIntro').textContent = t.workflow.intro;
      document.getElementById('workflowSteps').innerHTML = stepMarkup(t.workflow.steps);
      document.getElementById('workflowRemindersTitle').textContent = t.workflow.remindersTitle;
      document.getElementById('workflowReminders').innerHTML = listMarkup(t.workflow.reminders);

      document.getElementById('tipsTitle').textContent = t.tips.title;
      document.getElementById('tipsIntro').textContent = t.tips.intro;
      document.getElementById('tipsGrid').innerHTML = tipsMarkup(t.tips.groups);

      document.getElementById('faqTitle').textContent = t.faq.title;
      document.getElementById('faqIntro').textContent = t.faq.intro;
      document.getElementById('faqList').innerHTML = faqMarkup(t.faq.items);
      document.getElementById('footerNote').textContent = t.footerNote;

      try { localStorage.setItem(GUIDE_LANG_KEY, lang); } catch (err) {}
      syncPanelState();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedPanel = (() => {
        try {
          const stored = localStorage.getItem(GUIDE_PANEL_KEY);
          return PANEL_SET.has(stored) ? stored : 'modes';
        } catch (err) {
          return 'modes';
        }
      })();
      activePanel = savedPanel;

      const savedLang = (() => {
        try {
          return localStorage.getItem(GUIDE_LANG_KEY) || 'ko';
        } catch (err) {
          return 'ko';
        }
      })();

      renderGuide(savedLang);
      syncPanelState();

      document.getElementById('langBtn').addEventListener('click', () => {
        const next = document.getElementById('langBtn').dataset.nextLang || 'en';
        renderGuide(next);
      });

      document.getElementById('heroCta').addEventListener('click', () => {
        setActivePanel('workflow', { scroll: true });
      });
    });
  </script>
</body>
</html>
